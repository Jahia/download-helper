mutation TriggerDownload(
    $protocol: String!
    $url: String!
    $filename: String!
    $login: String
    $password: String
    $email: String
) {
    downloadHelper {
        trigger(
            protocol: $protocol
            url: $url
            filename: $filename
            login: $login
            password: $password
            email: $email
        )
    }
}
